<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>顧客情報一覧</title>
</head>
<body>
	<h2>顧客一覧</h2>
	
	<table>
		<tr>
			<th>ID</th>
			<th>お客様名</th>
			<th>住所</th>
			<th>電話番号</th>
			<th>ユーザID</th>
		</tr>

		<tr th:each="c : ${customerlist}">
			<td th:text="${c.id}"></td>
			<td th:text="${c.name}"></td>
			<td th:text="${c.address}"></td>
			<td th:text="${c.phone_number}"></td>
			<td th:text="${c.user_id}"></td>
		</tr>
	</table>
	
	<p class="back">
	    <a href="top" class="btn-back">顧客管理TOPページに戻る</a>
	</p>
</body>
</html>
