<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>変更結果表示</title>
</head>
<body>
	<h2>変更完了</h2>

	<h3>以下の商品を変更しました。</h3>
	<div>
	    <label>お客様名：</label>
	    <span th:text="${c.name}"></span>
	</div>
	<div>
	    <label>住所：</label>
	    <span th:text="${c.address}"></span>
	</div>
	<div>
	    <label>電話番号：</label>
	    <span th:text="${c.phone_number}"></span>
	</div>
	<div>
	    <label>ユーザID：</label>
	    <span th:text="${c.userId}"></span>
	</div>

	<div>
	    <label>パスワード：</label>
	    <span th:text="${c.password}"></span>
	</div>

	<p class="back">
	<a th:href="@{/customer/update}" class="btn-back">続けて変更する</a>
	</p>
	
	<p class="back">
	    <a href="top" class="btn-back">顧客管理TOPページに戻る</a>
	</p>
</body>
</html>
