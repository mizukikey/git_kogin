<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>登録完了</title>
</head>
<body>

<h2>登録完了</h2>

<p>以下の商品を登録しました。</p>

<div>
    <label>商品名：</label>
    <span th:text="${p.name}"></span>
</div>
<div>
    <label>値段：</label>
    <span th:text="${p.price}"></span> 円
</div>
<div>
    <label>在庫数：</label>
    <span th:text="${p.stock}"></span>
</div>

<p class="back">
<a th:href="@{/product/input}" class="btn-back">続けて登録する</a>
</p>
<p class="back">
    <a href="top" class="btn-back">商品管理TOPページに戻る</a>
</p>
</body>
</html>
