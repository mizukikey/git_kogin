<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>削除結果表示</title>
</head>
<body>
	<h2>削除完了</h2>

	<h3>以下の商品を削除しました。</h3>
	<div>
	    <label>ID：</label>
	    <span th:text="${session.result.id}"></span>
	</div>
	<div>
	    <label>お客様名：</label>
	    <span th:text="${session.result.name}"></span>
	</div>
	<div>
	    <label>住所：</label>
	    <span th:text="${session.result.address}"></span>
	</div>
	<div>
	    <label>電話番号：</label>
	    <span th:text="${session.result.phone_number}"></span>
	</div>

	<div>
	    <label>ユーザID：</label>
	    <span th:text="${session.result.userId}"></span>
	</div>

	
	<p class="back">
	<a th:href="@{/customer/delete}" class="btn-back">続けて削除する</a>
	</p>

	<p class="back">
	    <a href="top" class="btn-back">顧客管理TOPページに戻る</a>
	</p>
</body>
</html>
