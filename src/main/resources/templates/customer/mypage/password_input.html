<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2>パスワード変更</h2>

<form th:action="@{/customer/mypage/password_confirm}"
      th:object="${passwordForm}"
      method="post">

    <div class="form-row">
        <label>現在のパスワード：</label>
        <input type="password" th:field="*{currentPassword}" required>
        <div class="error-message"
             th:if="${#fields.hasErrors('currentPassword')}"
             th:errors="*{currentPassword}"></div>
    </div>

    <div class="form-row">
        <label>新しいパスワード：</label>
        <input type="password" th:field="*{newPassword}" required>
        <div class="error-message"
             th:if="${#fields.hasErrors('newPassword')}"
             th:errors="*{newPassword}"></div>
    </div>

    <div class="form-row">
        <label>新しいパスワード(確認)：</label>
        <input type="password" th:field="*{confirmPassword}" required>
        <div class="error-message"
             th:if="${#fields.hasErrors('confirmPassword')}"
             th:errors="*{confirmPassword}"></div>
    </div>

    <button type="submit">確認</button>
</form>

<p class="back">
    <a th:href="@{/customer/mypage/top}" class="btn-back">マイページに戻る</a>
</p>

</body>
</html>
