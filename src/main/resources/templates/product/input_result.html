<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>登録完了</title>
</head>
<body>

<h2>登録完了</h2>

<p>以下の商品を登録しました。</p>

<ul>
    <li>名前：<span th:text="${p.name}"></span></li>
    <li>値段：<span th:text="${p.price}"></span> 円</li>
    <li>在庫数：<span th:text="${p.stock}"></span></li>
</ul>

<a th:href="@{/product/input}">続けて登録する</a>
<p><a href="top">商品管理TOPページに戻る</p>
	
</body>
</html>
