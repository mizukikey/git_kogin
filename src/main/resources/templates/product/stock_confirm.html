<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="/css/style.css">
    <meta charset="UTF-8">
    <title>在庫情報確認</title>
</head>
<body>
    <h2>在庫情報確認</h2>
	<div class="container">
    <div class="info-row">
        <label>ID:</label>
        <span th:text="${session.result.id}"></span>
    </div>

    <div class="info-row">
        <label>商品名:</label>
        <span th:text="${session.result.name}"></span>
    </div>

    <div class="info-row">
        <label>値段:</label>
        <span>
            <span th:text="${session.result.price}"></span> 円
        </span>
    </div>

    <div class="info-row">
        <label>在庫数:</label>
        <span th:text="${session.result.stock}"></span>
    </div>

    <!-- 発注数を入力するフォーム -->
	<div class="info-row">
    <form action="/product/stock_result" method="post">
        <label for="orderQty">発注数：</label>
        <input type="number" id="orderQty" name="orderQty" min="1" required>
        <button type="submit" class="btn-back">発注する</button>
    </form>
	</div>
	</div>


    <p class="back">
        <a href="top" class="btn-back">商品管理TOPページに戻る</a>
    </p>
</body>
</html>
