<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>管理者情報入力</title>
</head>
<body>

<h2>管理者情報入力</h2>

<form th:action="@{/manager/input_confirm}"
      th:object="${manager}"
      method="post">

	  <div class="form-row">
		<label>お客様名：</label>
	      <input type="text"
	             th:field="*{name}"
	             maxlength="100"
	             required />
	      <div class="error-message" th:if="${#fields.hasErrors('name')}"
	           th:errors="*{name}"></div>
	  </div>
	  
	  <div class="form-row">
		<label>電話番号：</label>
	      <input type="text"
	             th:field="*{phoneNumber}"
	             maxlength="20"
	             required />
	      <div class="error-message" th:if="${#fields.hasErrors('phoneNumber')}"
	           th:errors="*{phoneNumber}"></div>
	  </div>
	  
	  <div class="form-row">
		<label>ユーザID：</label>
	      <input type="text"
	             th:field="*{userId}"
	             maxlength="50"
	             required />
	      <div class="error-message"th:if="${#fields.hasErrors('userId')}"
	           th:errors="*{userId}"></div>
	  </div>
	  
	  <div class="form-row">
		<label>パスワード：</label>
	      <input type="text"
	             th:field="*{password}"
	             maxlength="255"
	             required />
	      <div class="error-message" th:if="${#fields.hasErrors('password')}"
	           th:errors="*{password}"></div>
	  </div>

    <button type="submit">確認</button>
	<p class="back">
	    <a href="top" class="btn-back">管理者管理TOPページに戻る</a>
	</p>
</form>

</body>
</html>
