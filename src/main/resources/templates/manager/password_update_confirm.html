<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>パスワード変更確認</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<h2>パスワード変更確認</h2>

<form th:action="@{/manager/password_update_result}"
      th:object="${form}"
      method="post">

    <!-- hiddenで値を引き継ぐ -->
    <input type="hidden" th:field="*{id}" />
    <input type="hidden" th:field="*{currentPassword}" />
    <input type="hidden" th:field="*{newPassword}" />
    <input type="hidden" th:field="*{confirmPassword}" />

    <div class="container">
        <div class="info-row">
            <label>現在のパスワード：</label>
            <span>●●●●●●</span>
        </div>

        <div class="info-row">
            <label>新しいパスワード：</label>
            <span>●●●●●●</span>
        </div>

        <button type="submit">変更する</button>
    </div>
</form>

</body>
</html>
