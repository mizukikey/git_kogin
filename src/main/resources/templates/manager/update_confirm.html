<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>変更情報確認画面</title>
</head>
<body>
	<h2>管理者情報確認</h2>
	
	<form th:action="@{/manager/update_result}" 
	      th:object="${manager}" 
	      method="post">
		  <input type="hidden" th:field="*{id}">
		<div class="container">
		<div class="info-row">
		    <label>管理者名：</label>
		    <span th:text="*{name}"></span>
		    <input type="hidden" th:field="*{name}" />
		</div>

		<div class="info-row">
		    <label>電話番号：</label>
		    <span th:text="*{phoneNumber}"></span>
		    <input type="hidden" th:field="*{phoneNumber}" />
		</div>
		
		<div class="info-row">
		    <label>ユーザID：</label>
		    <span th:text="*{userId}"></span>
		    <input type="hidden" th:field="*{userId}" />
		</div>
		
<!--		<div class="info-row">-->
<!--		    <label>パスワード：</label>-->
<!--		    <span th:text="*{password}"></span>-->
<!--		    <input type="hidden" th:field="*{password}" />-->
<!--		</div>-->
		<div class="info-row">
	    <button type="submit">変更</button>
		</div>
		</div>
	</form>

	<p class="back">
	    <a href="top" class="btn-back">顧客管理TOPページに戻る</a>
	</p>
</body>
</html>
