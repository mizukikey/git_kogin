<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" href="/css/style.css">
<meta charset="UTF-8">
<title>登録完了</title>
</head>
<body>

<h2>登録完了</h2>

<p>以下の顧客を登録しました。</p>

<div>
    <label>お客様名：</label>
    <span th:text="${c.name}"></span>
</div>
<div>
    <label>住所：</label>
    <span th:text="${c.address}"></span>
</div>
<div>
    <label>電話番号：</label>
    <span th:text="${c.phone_number}"></span>
</div>
<div>
    <label>ユーザID：</label>
    <span th:text="${c.userId}"></span>
</div>

<div>
    <label>パスワード：</label>
    <span th:text="${c.password}"></span>
</div>

<p class="back">
    <a href="/" class="btn-back">総合TOPページに戻る</a>
</p>
</body>
</html>
